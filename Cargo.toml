[package]
name = "hok"
version = "0.1.0-beta.7"
edition = "2024"
description = "Hok is a CLI implementation of Scoop in Rust"
readme = "README.md"
repository = "https://github.com/chawyehsu/hok"
license = "Apache-2.0"

[workspace]
members = ["crates/hok-shim", "crates/hok-shim-spec", "crates/libscoop"]

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["cargo", "derive", "wrap_help"] }
clap_complete = "4.5.38"
clap-verbosity-flag = { version = "3.0.1", default-features = false, features = ["tracing"] }
crossterm = "0.28"
indicatif = "0.17.9"
regex = "1.5.3"
remove_dir_all = "0.7.0"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[dependencies.libscoop]
path = "./crates/libscoop"
version = "0.1.0-beta.7"

[dev-dependencies]
assert_fs = "1.1.3"
insta = { version = "1.46.3", features = ["filters"] }
insta-cmd = "0.7.0"
regex = "1.5.3"

[profile.release]
opt-level = 3
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "debuginfo"
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.ci]
inherits = "release"
debug = false
strip = "none"
lto = false
codegen-units = 16

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"
