name: Build

on:
  workflow_call:
    inputs:
      build_type:
        description: Build release or nightly artifacts
        required: false
        type: string
        default: release
  workflow_dispatch:
    inputs:
      build_type:
        description: Artifact type to build
        required: true
        type: choice
        options:
          - release
          - nightly
        default: release

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: i686-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }

    name: Build
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
      BINARY_NAME: hok
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Setup
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build
        run: cargo build --profile ${{ inputs.build_type == 'nightly' && 'ci' || 'release' }} --locked --target ${{ matrix.target }}

      - name: Prepare Artifact [Release]
        if: inputs.build_type == 'release'
        run: |
          $target = '${{ matrix.target }}'
          $binary = '${{ env.BINARY_NAME }}'
          Copy-Item "target/$target/release/$binary.exe" .
          Copy-Item "target/$target/release/$binary.pdb" .
          7z a "$binary-$target.zip" "$binary.exe" LICENSE README.md
          7z a "$binary-$target-symbols.zip" "$binary.pdb"

      - name: Prepare Artifact [Nightly]
        if: inputs.build_type == 'nightly'
        run: |
          $target = '${{ matrix.target }}'
          $binary = '${{ env.BINARY_NAME }}'
          Copy-Item "target/$target/ci/$binary.exe" .
          7z a "nightly-$binary-$target.zip" "$binary.exe" LICENSE README.md

      - name: Upload Artifacts [Release]
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.BINARY_NAME }}-${{ matrix.target }}.zip
            ${{ env.BINARY_NAME }}-${{ matrix.target }}-symbols.zip
          compression-level: 0
          retention-days: 1

      - name: Upload Artifacts [Nightly]
        if: inputs.build_type == 'nightly'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ matrix.target }}
          path: nightly-${{ env.BINARY_NAME }}-${{ matrix.target }}.zip
          compression-level: 0
          retention-days: 3
