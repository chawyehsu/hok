[package]
name = "scoop-hash"
version = "0.1.0-beta.7"
edition = "2021"
rust-version = "1.60.0"
description = "Hashing library for libscoop"
readme = "README.md"
repository = "https://github.com/chawyehsu/hok"
license = "MIT OR Apache-2.0"
keywords = ["hash", "scoop"]
categories = ["cryptography"]

[[bench]]
harness = false
name = "md5"
path = "benches/md5.rs"

[[bench]]
harness = false
name = "sha1"
path = "benches/sha1.rs"

[[bench]]
harness = false
name = "sha256"
path = "benches/sha256.rs"

[[bench]]
harness = false
name = "sha512"
path = "benches/sha512.rs"

[dependencies]
md-5 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
criterion = "0.4"

[features]
default = []
# The "rustcrypto" feature enables hash implementations from RustCrypto's crates.
rustcrypto = ["md-5", "sha1", "sha2"]
