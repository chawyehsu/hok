[package]
name = "libscoop"
version = "0.1.0-beta.7"
edition = "2021"
description = "Rust library implementation of Scoop"
documentation = "https://docs.rs/libscoop"
readme = "README.md"
repository = "https://github.com/chawyehsu/hok"
license = "MIT OR Apache-2.0"
keywords = ["package-manager", "scoop", "windows"]
categories = ["command-line-utilities"]

[dependencies]
chrono = "0.4"
curl = { version = "0.4", features = ["static-curl"] }
dirs = "5.0.1"
flume = "0.10"
futures = { version = "0.3", features = ["thread-pool"] }
git2 = "0.19.0"
md-5 = "0.10"
once_cell = "1.18.0"
rayon = "1.7.0"
regex = "1.5.3"
remove_dir_all = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
sysinfo = "0.29"
thiserror = "1.0"
tracing = "0.1.41"

# Archive
# infer = "0.9.0"
# zip = "0.6.2"

[dev-dependencies]
tempfile = "3.13.0"

[target."cfg(unix)".dependencies]
openssl = { version = "0.10.66", features = ["vendored"] }

[target."cfg(windows)".dependencies]
junction = "1.2.0"
winreg = "0.52"
