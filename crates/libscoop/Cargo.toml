[package]
name = "libscoop"
version = "0.1.0-beta.7"
edition = "2024"
description = "Rust library implementation of Scoop"
documentation = "https://docs.rs/libscoop"
readme = "README.md"
repository = "https://github.com/chawyehsu/hok"
license = "MIT OR Apache-2.0"
keywords = ["package-manager", "scoop", "windows"]
categories = ["command-line-utilities"]

[dependencies]
bzip2 = "0.6.1"
cab = "0.6.0"
chrono = "0.4"
curl = { version = "0.4", features = ["static-curl"] }
dirs = "5.0.1"
flate2 = "1.1.10"
flume = "0.10"
futures = { version = "0.3", features = ["thread-pool"] }
git2 = "0.19.0"
hex = "0.4.3"
iso9660 = "0.1.1"
lzma-rust2 = "0.22.0"
md-5 = "0.10"
msi = "0.10.0"
once_cell = "1.18.0"
rars = { version = "=0.9.4", default-features = false }
rayon = "1.7.0"
regex = "1.5.3"
remove_dir_all = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sevenz-rust2 = { version = "0.24.0", default-features = false, features = ["aes256", "bzip2", "ppmd", "util"] }
sha1 = "0.11"
sha2 = "0.11"
sysinfo = "0.29"
tar = "0.4.46"
thiserror = "1.0"
tracing = "0.1.41"
zip = { version = "9.0.4", default-features = false, features = ["deflate", "bzip2", "zstd", "deflate64"] }
zstd = "0.14.3"

# Archive
# infer = "0.9.0"
# zip = "0.6.2"

[dev-dependencies]
tempfile = "3.13.0"

[target."cfg(unix)".dependencies]
openssl = { version = "0.10.66", features = ["vendored"] }

[target."cfg(windows)".dependencies]
innospect = "0.2.0"
junction = "1.2.0"
nsis = "0.6.0"
winreg = "0.52"
